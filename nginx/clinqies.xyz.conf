# /etc/nginx/sites-available/clinqies.xyz
# After placing: ln -s /etc/nginx/sites-available/clinqies.xyz /etc/nginx/sites-enabled/
# Then: certbot --nginx -d clinqies.xyz -d www.clinqies.xyz

server {
    listen 80;
    server_name clinqies.xyz www.clinqies.xyz;
    return 301 https://clinqies.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.clinqies.xyz;
    ssl_certificate     /etc/letsencrypt/live/clinqies.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinqies.xyz/privkey.pem;
    return 301 https://clinqies.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name clinqies.xyz;

    ssl_certificate     /etc/letsencrypt/live/clinqies.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinqies.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Upload size limit (50MB + headroom)
    client_max_body_size 55M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Uploaded files — served directly, long cache
    location /f/ {
        alias /var/www/clinqies/uploads/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        # Prevent HTML execution from uploads
        add_header Content-Disposition "inline";
        types { }
        default_type application/octet-stream;
        # Re-allow known safe inline types
        location ~* \.(png|jpg|jpeg|gif|webp|svg|mp4|webm|mp3|ogg|wav|pdf)$ {
            default_type "";
        }
    }

    # API — proxy to Node
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Rate limit at nginx level for upload
        location /api/upload {
            limit_req zone=upload burst=10 nodelay;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 55M;
            proxy_request_buffering off;
        }
    }

    # Frontend — proxy to Node (serves static files)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Rate limiting zones — add to /etc/nginx/nginx.conf http block:
# limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/s;
